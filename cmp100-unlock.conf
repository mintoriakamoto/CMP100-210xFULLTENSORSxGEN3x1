# /etc/cmp100-unlock.conf  --  sourced by /usr/local/sbin/cmp100-unlock

# Space-separated PCI BDFs to unlock. Empty = auto-detect every 10de:1d84 / 10de:1df4.
# CMP100_BDFS="0000:01:00.0 0000:05:00.0"

# PCIe link stage. Gen3 runs before the Tensor stage (it only works pre-POST);
# Gen2 runs after it.
#   3 = Gen3: clear the CYA speed clamp pre-POST (secondary bus reset, then
#       retrain), before the Tensor stage. Falls back to 2 for a card that
#       loses Gen3 during the Tensor stage. Default.
#   2 = Gen2 only: the older signed-write path (policy/vector + CHANGE_SPEED).
#       Use this if the script reports the Gen3 fuses as blown.
#   0 = Tensor only, leave the link alone.
# The pre-1.1 knob CMP100_GEN2=0 is still accepted and means CMP100_PCIE=0.
CMP100_PCIE=3

# Extra services to stop before the driver handoff and restart afterwards.
# CMP100_STOP_SERVICES="ollama.service my-inference.service"

# How many retrain attempts per card (Gen3: upstream-port retrains after the
# clamp clear; Gen2: unbind/retrain/rebind cycles).
CMP100_RETRAIN_ATTEMPTS=3

# Optional HBM memory-clock lever. Applies a volatile NVML memory-clock VF
# offset of +138 (810 -> 877 MHz, ~+8% device bandwidth) after the Tensor/PCIe
# stages. Supported NVML API only, reversible, resets on power loss; a failure
# never affects the Tensor/PCIe unlock. Validated on 10de:1d84. Needs the
# cmp100-memclk helper, which install.sh builds when libnvidia-ml is present.
#   0   = off (default)
#   877 = enable
CMP100_HBM=0
