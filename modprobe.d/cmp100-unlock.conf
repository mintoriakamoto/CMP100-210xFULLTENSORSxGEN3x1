# Installed by cmp100-unlock.
# nouveau is loaded by the unlock script with explicit parameters only.
blacklist nouveau
options nouveau modeset=0
# Keep nvidia_drm off so no DRM client (desktop, switcheroo) can pin the card
# during the nouveau handoff; CUDA / NVML do not need it.
blacklist nvidia_drm
# RM policy: allow Gen2 as the maximum link speed (volatile register state
# from the signed writes is what actually enables it; this keeps RM from
# clamping to Gen1 on driver reload).
#
# DO NOT add RMPcieLinkSpeed here.
#
# RMPcieLinkSpeed=0x1 is a DRIVER-WIDE link-speed cap: it pins EVERY nvidia GPU on
# the host at 2.5 GT/s (Gen1), not only the CMP cards, and it is re-applied on
# every driver load, so it silently undoes the Gen3 clamp clear at the next boot.
# The Gen3 path needs no registry dword at all: the BAR0 0x8841c CYA clear plus an
# upstream-port retrain is what lifts the link. Verify the host is clean with:
#
#   grep RegistryDwords /proc/driver/nvidia/params      # must print ""
#
# (For the CMP 170HX, a different card on a different board, RmForceEnableGen2=1
# IS the dword that matters; it must never be shipped together with
# RMPcieLinkSpeed, which would cap the GeForce cards on that box at Gen1.)
